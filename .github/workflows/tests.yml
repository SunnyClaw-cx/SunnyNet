name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  architecture-selfcheck:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pytest
      - name: Architecture self-check
        shell: bash
        run: |
          python -c "import sys,torch,numpy;print('::notice::py=%s torch=%s numpy=%s gcc=%s'%(sys.version.split()[0],torch.__version__,numpy.__version__, __import__('shutil').which('gcc') or 'none'))" || true
          # shell 默认 -e, 叠加 pipefail 会让 pytest 失败直接终止脚本, 后面的
          # 摘要与注解都执行不到。这里临时关掉 -e 收下退出码。
          set +e
          pytest tests/ -q --tb=short -rf --color=no 2>&1 | tee "$RUNNER_TEMP/pytest.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' "$RUNNER_TEMP/pytest.log" > "$RUNNER_TEMP/plain.log"
            {
              echo "### architecture-selfcheck (${{ matrix.os }}, ${{ matrix.python-version }})"
              echo
              echo '```'
              tail -60 "$RUNNER_TEMP/plain.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E "^FAILED|^ERROR" "$RUNNER_TEMP/plain.log" | head -20 | while IFS= read -r line; do
              echo "::error::${{ matrix.os }}/py${{ matrix.python-version }} | $line"
            done || true
          fi
          exit "$rc"

  smoke-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pytest
      - name: End-to-end smoke (合成小语料 -> 训练 20 步)
        run: python -m pytest tests/test_smoke_pipeline.py -q

  simd:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86-64 上验证 AVX-512 内核的编译与拒绝加载路径
          - os: ubuntu-latest
            label: x86-64 compile
          # ARM64 上真实执行 NEON 内核 (原生 gcc, 无需交叉编译)
          - os: ubuntu-24.04-arm
            label: aarch64 native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest capstone ziglang
      - name: Build + run SIMD tests (${{ matrix.label }})
        run: python -m pytest tests/test_simd.py -q -rs